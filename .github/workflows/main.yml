name: Create YTMinimum app

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to a decrypted YouTube 21.30.5 IPA"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweak:
    name: Build YTMinimum
    runs-on: macos-latest

    steps:
      - name: Check out YTMinimum
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Configure build environment
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v5
        with:
          path: theos
          key: theos-16362d3a-ios16.5

      - name: Set up Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 16362d3aa83a0acd56df4493d575d34306d42478
          path: theos
          submodules: recursive

      - name: Install iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Compile YTMinimum
        run: make clean package

      - name: Collect package
        run: |
          deb="$(find packages -type f -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "::error::The tweak build did not produce a deb package."
            exit 1
          fi
          cp "$deb" ytminimum.deb

      - name: Upload built tweak
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: ytminimum.deb
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package IPA
    runs-on: macos-latest
    needs: build-tweak
    permissions:
      contents: write

    steps:
      - name: Download built tweak
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Download and validate IPA
        run: |
          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type="$(file --mime-type -b youtube.ipa)"
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::The downloaded file is not a valid IPA. Detected type: $file_type"
            exit 1
          fi

          validation_dir="$(mktemp -d)"
          unzip -q youtube.ipa -d "$validation_dir"
          app_path="$(find "$validation_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::The IPA does not contain a Payload app."
            exit 1
          fi

          youtube_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          if [ "$youtube_version" != "21.30.5" ]; then
            echo "::error::YTMinimum requires YouTube 21.30.5, but the IPA contains $youtube_version."
            exit 1
          fi

      - name: Install Cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject YTMinimum
        run: |
          output="YTMinimum_YouTube_21.30.5_${{ github.run_number }}.ipa"
          cyan \
            -i youtube.ipa \
            -o "$output" \
            -uwef ytminimum.deb \
            -n "${{ github.event.inputs.display_name }}" \
            -b "${{ github.event.inputs.bundle_id }}"

      - name: Upload to draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytminimum-${{ github.run_number }}
          name: YTMinimum for YouTube 21.30.5 (${{ github.run_number }})
          files: YTMinimum_YouTube_21.30.5_${{ github.run_number }}.ipa
          draft: true

      - name: Output release URL
        run: echo "::notice::Release available at https://github.com/${{ github.repository }}/releases"
